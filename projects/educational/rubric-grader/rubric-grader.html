<!DOCTYPE html>
<!--
  Rubric Grader — Halison App Studio example

  Build a weighted rubric, pick a level per criterion, and get an instant
  weighted score, percentage and breakdown. Saves locally; print-friendly.

  From the Halison App Studio public library:
  https://github.com/halisonworks/public-app-studio

  Permitted use: personal, educational, and other non-commercial use. You may
  modify it, but keep this header and the source link intact, and do not sell,
  commercialize, or republish it. Released under the Halison App Studio Examples
  License — see the LICENSE file in the repository above.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rubric Grader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* ── Print styles ─────────────────────────────────────────────── */
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; }
      #app { padding: 0 !important; }
      .print-card {
        box-shadow: none !important;
        border: 1px solid #d1d5db !important;
        break-inside: avoid;
      }
      #grading-panel { display: block !important; }
      #builder-panel { display: none !important; }
      .tab-bar { display: none !important; }
    }

    /* ── Misc helpers ─────────────────────────────────────────────── */
    [x-cloak] { display: none; }
    .level-btn { transition: all 0.15s ease; }
    .level-btn.selected-1 { background-color: #fee2e2; border-color: #f87171; color: #991b1b; }
    .level-btn.selected-2 { background-color: #fef9c3; border-color: #facc15; color: #854d0e; }
    .level-btn.selected-3 { background-color: #dbeafe; border-color: #60a5fa; color: #1e40af; }
    .level-btn.selected-4 { background-color: #dcfce7; border-color: #4ade80; color: #166534; }
    .score-ring {
      width: 96px; height: 96px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; font-weight: 700;
      border: 6px solid;
    }
    .ring-F  { border-color: #f87171; color: #dc2626; }
    .ring-D  { border-color: #fb923c; color: #ea580c; }
    .ring-C  { border-color: #facc15; color: #ca8a04; }
    .ring-B  { border-color: #60a5fa; color: #2563eb; }
    .ring-A  { border-color: #4ade80; color: #16a34a; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">

<div id="app" class="max-w-5xl mx-auto px-4 py-6">

  <!-- Header -->
  <header class="mb-6">
    <h1 class="text-3xl font-bold text-gray-800">Rubric Grader</h1>
    <p class="text-gray-500 text-sm mt-1">Build a weighted rubric, then grade student work instantly.</p>
  </header>

  <!-- Tab bar -->
  <div class="tab-bar flex gap-2 mb-5 no-print">
    <button id="tab-builder" onclick="switchTab('builder')"
      class="px-5 py-2 rounded-lg font-semibold text-sm transition-colors bg-indigo-600 text-white shadow">
      Rubric Builder
    </button>
    <button id="tab-grader" onclick="switchTab('grader')"
      class="px-5 py-2 rounded-lg font-semibold text-sm transition-colors bg-white text-gray-600 hover:bg-gray-50 border border-gray-300">
      Grade Student
    </button>
  </div>

  <!-- ================================================================
       BUILDER PANEL
  ================================================================ -->
  <div id="builder-panel">

    <div class="bg-white rounded-2xl shadow p-6 print-card mb-4">
      <div class="flex items-start justify-between gap-4 flex-wrap">
        <div class="flex-1 min-w-[220px]">
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Rubric Title</label>
          <input id="rubric-title" type="text" placeholder="e.g. Argumentative Essay Rubric"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-gray-800 font-semibold text-lg focus:outline-none focus:ring-2 focus:ring-indigo-400"
            oninput="save()" />
        </div>
        <div class="flex-1 min-w-[220px]">
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Assignment / Course</label>
          <input id="rubric-course" type="text" placeholder="e.g. English 10 — Unit 3"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-400"
            oninput="save()" />
        </div>
      </div>
    </div>

    <!-- Level header legend -->
    <div class="bg-indigo-50 border border-indigo-200 rounded-xl px-5 py-3 mb-4 hidden md:grid grid-cols-[2fr_80px_1fr_1fr_1fr_1fr_40px] gap-3 items-center text-xs font-semibold text-indigo-700 uppercase tracking-wide no-print">
      <span>Criterion</span>
      <span class="text-center">Weight&nbsp;%</span>
      <span class="text-center px-1">1 — Beginning</span>
      <span class="text-center px-1">2 — Developing</span>
      <span class="text-center px-1">3 — Proficient</span>
      <span class="text-center px-1">4 — Excellent</span>
      <span></span>
    </div>

    <div id="criteria-list"></div>

    <button onclick="addCriterion()"
      class="no-print mt-4 w-full border-2 border-dashed border-indigo-300 text-indigo-500 rounded-xl py-3 font-semibold hover:bg-indigo-50 transition-colors">
      + Add Criterion
    </button>

    <!-- Weight total -->
    <div id="weight-warning" class="mt-3 text-sm font-semibold text-center hidden"></div>

  </div><!-- /builder-panel -->

  <!-- ================================================================
       GRADER PANEL
  ================================================================ -->
  <div id="grading-panel" class="hidden">

    <!-- Student info -->
    <div class="bg-white rounded-2xl shadow p-6 print-card mb-5">
      <h2 id="print-rubric-title" class="text-xl font-bold text-gray-800 mb-1"></h2>
      <p id="print-rubric-course" class="text-sm text-gray-500 mb-4"></p>
      <div class="flex flex-wrap gap-4">
        <div class="flex-1 min-w-[200px]">
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Student Name</label>
          <input id="student-name" type="text" placeholder="Full name"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400"
            oninput="computeScore()" />
        </div>
        <div class="flex-1 min-w-[200px]">
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Date</label>
          <input id="grade-date" type="date"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400" />
        </div>
      </div>
    </div>

    <!-- Grading rows -->
    <div id="grade-rows" class="space-y-3 mb-5"></div>

    <!-- Score summary -->
    <div class="bg-white rounded-2xl shadow p-6 print-card mb-5">
      <div class="flex items-center gap-6 flex-wrap">
        <div id="score-ring" class="score-ring ring-A shrink-0">—</div>
        <div class="flex-1">
          <div class="text-4xl font-extrabold text-gray-800" id="score-pct">—</div>
          <div class="text-lg font-semibold text-gray-500 mt-1" id="score-label">Grade your student to see results</div>
          <div class="text-sm text-gray-400 mt-1" id="score-detail"></div>
        </div>
      </div>
    </div>

    <!-- Per-criterion breakdown -->
    <div class="bg-white rounded-2xl shadow p-6 print-card mb-5">
      <h3 class="font-bold text-gray-700 mb-3">Per-Criterion Breakdown</h3>
      <div id="breakdown-table"></div>
    </div>

    <!-- Comments -->
    <div class="bg-white rounded-2xl shadow p-6 print-card mb-5">
      <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Teacher Comments (optional)</label>
      <textarea id="teacher-comments" rows="4" placeholder="Write any overall feedback here…"
        class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400 text-gray-700 resize-y"></textarea>
    </div>

    <!-- Reset grades button -->
    <div class="no-print flex justify-end">
      <button onclick="resetGrades()"
        class="px-4 py-2 text-sm bg-red-50 text-red-600 border border-red-200 rounded-lg hover:bg-red-100 font-semibold transition-colors">
        Reset Grades
      </button>
    </div>

  </div><!-- /grading-panel -->

</div><!-- /app -->

<script>
/* ══════════════════════════════════════════════════════════════════════
   DATA MODEL
══════════════════════════════════════════════════════════════════════ */
const STORAGE_KEY = 'rubric-grader-v1';

const DEFAULT_RUBRIC = {
  title: 'Argumentative Essay Rubric',
  course: 'English 10 — Unit 3',
  criteria: [
    {
      id: uid(), name: 'Thesis & Claim',
      weight: 20,
      levels: [
        'Thesis is absent or unclear; the central claim cannot be identified.',
        'Thesis is present but vague; the claim is general and lacks focus.',
        'Thesis is clear and arguable; the claim is stated with reasonable focus.',
        'Thesis is compelling and specific; sets a precise, insightful direction.'
      ]
    },
    {
      id: uid(), name: 'Evidence & Support',
      weight: 25,
      levels: [
        'Little or no evidence is used; sources are absent or irrelevant.',
        'Some evidence is cited but it is insufficient or poorly integrated.',
        'Adequate evidence from credible sources is cited and mostly integrated.',
        'Strong, varied evidence is seamlessly integrated and clearly supports the argument.'
      ]
    },
    {
      id: uid(), name: 'Reasoning & Analysis',
      weight: 25,
      levels: [
        'Reasoning is absent; evidence is listed without any analysis.',
        'Reasoning is superficial; analysis rarely connects evidence to the claim.',
        'Reasoning is logical; analysis connects most evidence to the claim.',
        'Reasoning is thorough and nuanced; every piece of evidence deepens the argument.'
      ]
    },
    {
      id: uid(), name: 'Counterargument',
      weight: 15,
      levels: [
        'No counterargument is acknowledged.',
        'A counterargument is mentioned but not addressed.',
        'A counterargument is acknowledged and briefly refuted.',
        'A counterargument is acknowledged, refuted effectively, and strengthens the essay.'
      ]
    },
    {
      id: uid(), name: 'Organization & Structure',
      weight: 10,
      levels: [
        'Essay lacks clear structure; paragraphs are disorganized and hard to follow.',
        'Basic structure is present but transitions and flow are weak.',
        'Essay is well-organized with clear introduction, body, and conclusion.',
        'Essay flows seamlessly; structure enhances the persuasive impact throughout.'
      ]
    },
    {
      id: uid(), name: 'Language, Style & Mechanics',
      weight: 5,
      levels: [
        'Frequent errors in grammar, spelling, or punctuation severely impede clarity.',
        'Several errors are present; vocabulary is limited or imprecise.',
        'Prose is mostly clear with minor errors; vocabulary is appropriate.',
        'Prose is polished and precise; vocabulary is sophisticated and error-free.'
      ]
    }
  ]
};

let state = { rubric: null, grades: {} }; // grades: { criterionId: level (1-4) }

function uid() {
  return Math.random().toString(36).slice(2, 10);
}

/* ══════════════════════════════════════════════════════════════════════
   PERSISTENCE
══════════════════════════════════════════════════════════════════════ */
function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      state.rubric = parsed.rubric || DEFAULT_RUBRIC;
      state.grades = parsed.grades || {};
    } else {
      state.rubric = JSON.parse(JSON.stringify(DEFAULT_RUBRIC));
      state.grades = {};
    }
  } catch (e) {
    state.rubric = JSON.parse(JSON.stringify(DEFAULT_RUBRIC));
    state.grades = {};
  }
}

function save() {
  // Collect current title/course from inputs if builder is active
  const titleEl = document.getElementById('rubric-title');
  const courseEl = document.getElementById('rubric-course');
  if (titleEl) state.rubric.title = titleEl.value;
  if (courseEl) state.rubric.course = courseEl.value;
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ rubric: state.rubric, grades: state.grades }));
  updateWeightWarning();
}

/* ══════════════════════════════════════════════════════════════════════
   TAB SWITCHING
══════════════════════════════════════════════════════════════════════ */
let activeTab = 'builder';

function switchTab(tab) {
  activeTab = tab;
  document.getElementById('builder-panel').classList.toggle('hidden', tab !== 'builder');
  document.getElementById('grading-panel').classList.toggle('hidden', tab !== 'grader');
  document.getElementById('tab-builder').className = tab === 'builder'
    ? 'px-5 py-2 rounded-lg font-semibold text-sm transition-colors bg-indigo-600 text-white shadow'
    : 'px-5 py-2 rounded-lg font-semibold text-sm transition-colors bg-white text-gray-600 hover:bg-gray-50 border border-gray-300';
  document.getElementById('tab-grader').className = tab === 'grader'
    ? 'px-5 py-2 rounded-lg font-semibold text-sm transition-colors bg-indigo-600 text-white shadow'
    : 'px-5 py-2 rounded-lg font-semibold text-sm transition-colors bg-white text-gray-600 hover:bg-gray-50 border border-gray-300';
  if (tab === 'grader') renderGrader();
}

/* ══════════════════════════════════════════════════════════════════════
   BUILDER
══════════════════════════════════════════════════════════════════════ */
function renderBuilder() {
  document.getElementById('rubric-title').value = state.rubric.title || '';
  document.getElementById('rubric-course').value = state.rubric.course || '';
  renderCriteriaList();
  updateWeightWarning();
}

function renderCriteriaList() {
  const list = document.getElementById('criteria-list');
  list.innerHTML = '';
  state.rubric.criteria.forEach((c, idx) => {
    list.appendChild(buildCriterionRow(c, idx));
  });
}

function buildCriterionRow(c, idx) {
  const wrap = document.createElement('div');
  wrap.className = 'bg-white rounded-2xl shadow print-card mb-3 p-4';
  wrap.id = 'crit-' + c.id;

  // Row 1: name + weight + delete
  const topRow = document.createElement('div');
  topRow.className = 'flex items-center gap-3 mb-3 flex-wrap';

  const nameInput = document.createElement('input');
  nameInput.type = 'text';
  nameInput.value = c.name;
  nameInput.placeholder = 'Criterion name';
  nameInput.className = 'flex-1 min-w-[160px] border border-gray-300 rounded-lg px-3 py-1.5 font-semibold text-gray-800 focus:outline-none focus:ring-2 focus:ring-indigo-400';
  nameInput.oninput = () => { c.name = nameInput.value; save(); };

  const weightWrap = document.createElement('div');
  weightWrap.className = 'flex items-center gap-1';
  const wLabel = document.createElement('span');
  wLabel.textContent = 'Weight:';
  wLabel.className = 'text-xs font-semibold text-gray-500';
  const weightInput = document.createElement('input');
  weightInput.type = 'number';
  weightInput.min = '1'; weightInput.max = '100';
  weightInput.value = c.weight;
  weightInput.className = 'w-16 border border-gray-300 rounded-lg px-2 py-1.5 text-center font-semibold text-gray-800 focus:outline-none focus:ring-2 focus:ring-indigo-400';
  weightInput.oninput = () => { c.weight = parseInt(weightInput.value) || 0; save(); };
  const wPct = document.createElement('span');
  wPct.textContent = '%';
  wPct.className = 'text-xs text-gray-400';
  weightWrap.append(wLabel, weightInput, wPct);

  const delBtn = document.createElement('button');
  delBtn.innerHTML = '&#x2715;';
  delBtn.title = 'Remove criterion';
  delBtn.className = 'no-print text-red-400 hover:text-red-600 font-bold text-lg leading-none px-1';
  delBtn.onclick = () => {
    state.rubric.criteria.splice(idx, 1);
    delete state.grades[c.id];
    save();
    renderCriteriaList();
  };

  topRow.append(nameInput, weightWrap, delBtn);

  // Row 2: level descriptors
  const levelsRow = document.createElement('div');
  levelsRow.className = 'grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-2';

  const levelLabels = ['1 — Beginning', '2 — Developing', '3 — Proficient', '4 — Excellent'];
  const levelColors = ['border-red-200 bg-red-50', 'border-yellow-200 bg-yellow-50', 'border-blue-200 bg-blue-50', 'border-green-200 bg-green-50'];
  const labelColors = ['text-red-600', 'text-yellow-700', 'text-blue-700', 'text-green-700'];

  c.levels.forEach((desc, li) => {
    const cell = document.createElement('div');
    cell.className = 'rounded-lg border p-2 ' + levelColors[li];

    const lbl = document.createElement('div');
    lbl.textContent = levelLabels[li];
    lbl.className = 'text-xs font-bold mb-1 ' + labelColors[li];

    const ta = document.createElement('textarea');
    ta.value = desc;
    ta.rows = 3;
    ta.placeholder = 'Describe this level…';
    ta.className = 'w-full text-xs text-gray-700 bg-transparent border-none resize-none focus:outline-none focus:ring-0 leading-snug';
    ta.oninput = () => { c.levels[li] = ta.value; save(); };

    cell.append(lbl, ta);
    levelsRow.appendChild(cell);
  });

  wrap.append(topRow, levelsRow);
  return wrap;
}

function addCriterion() {
  state.rubric.criteria.push({
    id: uid(),
    name: 'New Criterion',
    weight: 10,
    levels: [
      'Does not meet expectations.',
      'Partially meets expectations.',
      'Meets expectations.',
      'Exceeds expectations.'
    ]
  });
  save();
  renderCriteriaList();
  // Scroll to new item
  const list = document.getElementById('criteria-list');
  list.lastElementChild && list.lastElementChild.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function updateWeightWarning() {
  const total = state.rubric.criteria.reduce((s, c) => s + (parseInt(c.weight) || 0), 0);
  const el = document.getElementById('weight-warning');
  if (!el) return;
  if (total === 100) {
    el.className = 'mt-3 text-sm font-semibold text-center text-green-600';
    el.textContent = 'Weights total: 100% ✓';
    el.classList.remove('hidden');
  } else {
    el.className = 'mt-3 text-sm font-semibold text-center text-amber-600';
    el.textContent = `Weights total: ${total}% — adjust to reach 100% for correct scoring.`;
    el.classList.remove('hidden');
  }
}

/* ══════════════════════════════════════════════════════════════════════
   GRADER
══════════════════════════════════════════════════════════════════════ */
function renderGrader() {
  // Header info
  document.getElementById('print-rubric-title').textContent = state.rubric.title || 'Untitled Rubric';
  document.getElementById('print-rubric-course').textContent = state.rubric.course || '';

  // Set today's date if empty
  const dateEl = document.getElementById('grade-date');
  if (!dateEl.value) dateEl.value = new Date().toISOString().slice(0, 10);

  const container = document.getElementById('grade-rows');
  container.innerHTML = '';

  state.rubric.criteria.forEach(c => {
    const card = document.createElement('div');
    card.className = 'bg-white rounded-2xl shadow print-card p-4';

    const header = document.createElement('div');
    header.className = 'flex items-baseline gap-2 mb-3 flex-wrap';
    const nameSpan = document.createElement('span');
    nameSpan.className = 'font-bold text-gray-800';
    nameSpan.textContent = c.name;
    const wtSpan = document.createElement('span');
    wtSpan.className = 'text-xs text-gray-400 font-medium';
    wtSpan.textContent = `(${c.weight}%)`;
    header.append(nameSpan, wtSpan);

    const levels = document.createElement('div');
    levels.className = 'grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-2';

    const levelLabels = ['1 — Beginning', '2 — Developing', '3 — Proficient', '4 — Excellent'];

    c.levels.forEach((desc, li) => {
      const levelNum = li + 1;
      const btn = document.createElement('button');
      btn.id = `level-btn-${c.id}-${levelNum}`;
      btn.className = 'level-btn text-left rounded-lg border-2 border-gray-200 bg-gray-50 px-3 py-2 hover:border-gray-400 transition-all';
      if (state.grades[c.id] === levelNum) {
        btn.classList.add('selected-' + levelNum);
        btn.classList.remove('bg-gray-50');
      }

      const lbl = document.createElement('div');
      lbl.className = 'text-xs font-bold mb-1 text-gray-500';
      lbl.textContent = levelLabels[li];

      const descEl = document.createElement('p');
      descEl.className = 'text-xs text-gray-600 leading-snug';
      descEl.textContent = desc;

      btn.append(lbl, descEl);
      btn.onclick = () => selectLevel(c.id, levelNum);
      levels.appendChild(btn);
    });

    card.append(header, levels);
    container.appendChild(card);
  });

  computeScore();
}

function selectLevel(criterionId, level) {
  // Toggle off if already selected
  if (state.grades[criterionId] === level) {
    delete state.grades[criterionId];
  } else {
    state.grades[criterionId] = level;
  }
  save();

  // Update button appearances for this criterion
  for (let i = 1; i <= 4; i++) {
    const btn = document.getElementById(`level-btn-${criterionId}-${i}`);
    if (!btn) continue;
    btn.className = 'level-btn text-left rounded-lg border-2 border-gray-200 bg-gray-50 px-3 py-2 hover:border-gray-400 transition-all';
    if (state.grades[criterionId] === i) {
      btn.classList.add('selected-' + i);
      btn.classList.remove('bg-gray-50');
    }
    // preserve children layout
    const lbl = btn.children[0];
    const descEl = btn.children[1];
    if (lbl) lbl.className = 'text-xs font-bold mb-1 text-gray-500';
    if (descEl) descEl.className = 'text-xs text-gray-600 leading-snug';
  }

  computeScore();
}

function computeScore() {
  const criteria = state.rubric.criteria;
  const totalWeight = criteria.reduce((s, c) => s + (parseInt(c.weight) || 0), 0) || 100;

  let weightedSum = 0;
  let gradedWeight = 0;

  criteria.forEach(c => {
    const lvl = state.grades[c.id];
    if (lvl != null) {
      weightedSum += ((lvl / 4) * (parseInt(c.weight) || 0));
      gradedWeight += (parseInt(c.weight) || 0);
    }
  });

  const gradedCount = Object.keys(state.grades).length;
  const allGraded = gradedCount === criteria.length && criteria.length > 0;

  const pct = totalWeight > 0 ? Math.round((weightedSum / totalWeight) * 100) : 0;

  // Letter / band
  let letter, feedback, ringClass;
  if (!allGraded) {
    letter = '—';
    feedback = `${gradedCount} of ${criteria.length} criteria graded`;
    ringClass = 'ring-A';
  } else if (pct >= 90) {
    letter = 'A'; feedback = 'Excellent work — outstanding performance across all criteria.'; ringClass = 'ring-A';
  } else if (pct >= 80) {
    letter = 'B'; feedback = 'Good work — solid performance with minor areas for growth.'; ringClass = 'ring-B';
  } else if (pct >= 70) {
    letter = 'C'; feedback = 'Satisfactory — meets basic expectations but needs improvement.'; ringClass = 'ring-C';
  } else if (pct >= 60) {
    letter = 'D'; feedback = 'Below average — several significant areas need attention.'; ringClass = 'ring-D';
  } else {
    letter = 'F'; feedback = 'Does not yet meet expectations — major revision required.'; ringClass = 'ring-F';
  }

  const ring = document.getElementById('score-ring');
  ring.textContent = letter;
  ring.className = 'score-ring shrink-0 ' + ringClass;

  document.getElementById('score-pct').textContent = allGraded ? pct + '%' : (gradedCount > 0 ? 'In progress…' : '—');
  document.getElementById('score-label').textContent = feedback;
  document.getElementById('score-detail').textContent = allGraded
    ? `Weighted points: ${weightedSum.toFixed(1)} / ${totalWeight}`
    : '';

  renderBreakdown(weightedSum, totalWeight);
}

function renderBreakdown(weightedSum, totalWeight) {
  const container = document.getElementById('breakdown-table');
  container.innerHTML = '';

  const table = document.createElement('table');
  table.className = 'w-full text-sm border-collapse';

  const thead = document.createElement('thead');
  thead.innerHTML = `<tr class="border-b border-gray-200 text-xs text-gray-500 uppercase">
    <th class="text-left py-2 pr-3 font-semibold">Criterion</th>
    <th class="text-center py-2 px-2 font-semibold">Weight</th>
    <th class="text-center py-2 px-2 font-semibold">Level</th>
    <th class="text-right py-2 pl-2 font-semibold">Contribution</th>
  </tr>`;
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  state.rubric.criteria.forEach(c => {
    const lvl = state.grades[c.id];
    const w = parseInt(c.weight) || 0;
    const contrib = lvl != null ? ((lvl / 4) * w).toFixed(1) : '—';

    const levelNames = ['—', 'Beginning', 'Developing', 'Proficient', 'Excellent'];
    const levelColors = ['text-gray-400', 'text-red-600', 'text-yellow-700', 'text-blue-700', 'text-green-700'];
    const lColor = lvl != null ? levelColors[lvl] : levelColors[0];

    const tr = document.createElement('tr');
    tr.className = 'border-b border-gray-100 last:border-0';
    tr.innerHTML = `
      <td class="py-2 pr-3 font-medium text-gray-700">${escHtml(c.name)}</td>
      <td class="py-2 px-2 text-center text-gray-500">${w}%</td>
      <td class="py-2 px-2 text-center font-semibold ${lColor}">${lvl != null ? lvl + ' — ' + levelNames[lvl] : '—'}</td>
      <td class="py-2 pl-2 text-right font-semibold text-gray-700">${contrib !== '—' ? contrib + ' pts' : '—'}</td>
    `;
    tbody.appendChild(tr);
  });

  // Total row
  const totalGraded = Object.keys(state.grades).length === state.rubric.criteria.length && state.rubric.criteria.length > 0;
  const trTotal = document.createElement('tr');
  trTotal.className = 'font-bold bg-gray-50';
  const pctDisplay = totalGraded ? Math.round((weightedSum / totalWeight) * 100) + '%' : '—';
  trTotal.innerHTML = `
    <td class="py-2 pr-3 text-gray-800" colspan="1">Total</td>
    <td class="py-2 px-2 text-center text-gray-600">${totalWeight}%</td>
    <td class="py-2 px-2 text-center text-gray-600">${pctDisplay}</td>
    <td class="py-2 pl-2 text-right text-gray-800">${totalGraded ? weightedSum.toFixed(1) + ' pts' : '—'}</td>
  `;
  tbody.appendChild(trTotal);

  table.appendChild(tbody);
  container.appendChild(table);
}

function resetGrades() {
  if (!confirm('Clear all selected levels for this student?')) return;
  state.grades = {};
  document.getElementById('student-name').value = '';
  document.getElementById('teacher-comments').value = '';
  save();
  renderGrader();
}

/* ══════════════════════════════════════════════════════════════════════
   UTILITIES
══════════════════════════════════════════════════════════════════════ */
function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/* ══════════════════════════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════════════════════════ */
(function init() {
  load();
  renderBuilder();
})();
</script>
