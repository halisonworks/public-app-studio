<script>
/* =========================================================
   EXPRESSION PARSER / EVALUATOR
   Supports: numbers, x, +, -, *, /, ^, parentheses,
             implicit multiplication (2x, 3(x+1), (x+1)(x-1)),
             functions: sin, cos, tan, sqrt, abs, ln, log
   No eval() is used.
   ========================================================= */
(function(){
"use strict";

// ---- Tokeniser ----
function tokenise(src){
  const tokens=[];
  let i=0;
  src=src.trim().toLowerCase();
  while(i<src.length){
    const c=src[i];
    if(c===' '||c==='\t'){i++;continue;}
    if('0123456789.'.includes(c)){
      let num='';
      while(i<src.length&&'0123456789.'.includes(src[i])) num+=src[i++];
      tokens.push({t:'num',v:parseFloat(num)});
    } else if(c==='x'){
      tokens.push({t:'var'});i++;
    } else if('+-*/^()'.includes(c)){
      tokens.push({t:'op',v:c});i++;
    } else if(/[a-z]/.test(c)){
      let name='';
      while(i<src.length&&/[a-z]/.test(src[i])) name+=src[i++];
      tokens.push({t:'fn',v:name});
    } else {
      throw new Error('Ukjent tegn: '+c);
    }
  }
  return tokens;
}

// Insert implicit multiplication tokens where needed:
// num/var/close_paren followed by num/var/open_paren/fn
function insertImplicit(tokens){
  const out=[];
  for(let i=0;i<tokens.length;i++){
    out.push(tokens[i]);
    if(i+1<tokens.length){
      const a=tokens[i], b=tokens[i+1];
      const aRight=(a.t==='num'||a.t==='var'||(a.t==='op'&&a.v===')'));
      const bLeft=(b.t==='num'||b.t==='var'||(b.t==='op'&&b.v==='(')||b.t==='fn');
      if(aRight&&bLeft) out.push({t:'op',v:'*'});
    }
  }
  return out;
}

// ---- Recursive-descent parser → AST ----
function parse(tokens){
  let pos=0;
  function peek(){ return tokens[pos]; }
  function consume(){ return tokens[pos++]; }
  function expect(type,val){
    const t=consume();
    if(t.t!==type||(val!==undefined&&t.v!==val)) throw new Error('Parse-feil');
    return t;
  }

  function parseExpr(){ return parseAddSub(); }

  function parseAddSub(){
    let left=parseMulDiv();
    while(peek()&&peek().t==='op'&&(peek().v==='+'||peek().v==='-')){
      const op=consume().v;
      const right=parseMulDiv();
      left={t:'binop',op,left,right};
    }
    return left;
  }

  function parseMulDiv(){
    let left=parseUnary();
    while(peek()&&peek().t==='op'&&(peek().v==='*'||peek().v==='/')){
      const op=consume().v;
      const right=parseUnary();
      left={t:'binop',op,left,right};
    }
    return left;
  }

  function parseUnary(){
    if(peek()&&peek().t==='op'&&peek().v==='-'){
      consume();
      const arg=parsePower();
      return{t:'neg',arg};
    }
    if(peek()&&peek().t==='op'&&peek().v==='+'){
      consume();
      return parsePower();
    }
    return parsePower();
  }

  function parsePower(){
    let base=parseAtom();
    if(peek()&&peek().t==='op'&&peek().v==='^'){
      consume();
      const exp=parseUnary();
      return{t:'binop',op:'^',left:base,right:exp};
    }
    return base;
  }

  function parseAtom(){
    const t=peek();
    if(!t) throw new Error('Uventet slutt på uttrykk');
    if(t.t==='num'){ consume(); return{t:'num',v:t.v}; }
    if(t.t==='var'){ consume(); return{t:'var'}; }
    if(t.t==='fn'){
      consume();
      expect('op','(');
      const arg=parseExpr();
      expect('op',')');
      return{t:'fn',name:t.v,arg};
    }
    if(t.t==='op'&&t.v==='('){
      consume();
      const inner=parseExpr();
      expect('op',')');
      return inner;
    }
    throw new Error('Uventet token: '+JSON.stringify(t));
  }

  const ast=parseExpr();
  if(pos<tokens.length) throw new Error('Uventet innhold etter uttrykket');
  return ast;
}

// ---- AST evaluator ----
function evalAST(node,x){
  switch(node.t){
    case 'num': return node.v;
    case 'var': return x;
    case 'neg': return -evalAST(node.arg,x);
    case 'fn':{
      const a=evalAST(node.arg,x);
      switch(node.name){
        case 'sin': return Math.sin(a);
        case 'cos': return Math.cos(a);
        case 'tan': return Math.tan(a);
        case 'sqrt': return Math.sqrt(a);
        case 'abs': return Math.abs(a);
        case 'ln': return Math.log(a);
        case 'log': return Math.log10(a);
        default: throw new Error('Ukjent funksjon: '+node.name);
      }
    }
    case 'binop':{
      const l=evalAST(node.left,x), r=evalAST(node.right,x);
      switch(node.op){
        case '+': return l+r;
        case '-': return l-r;
        case '*': return l*r;
        case '/': return l/r;
        case '^': return Math.pow(l,r);
      }
    }
    default: throw new Error('Ukjent node');
  }
}

// ---- Public API ----
function compileFn(expr){
  if(!expr||!expr.trim()) throw new Error('Tom funksjon');
  const tokens=insertImplicit(tokenise(expr));
  const ast=parse(tokens);
  return function(x){ return evalAST(ast,x); };
}

window._graftegner_compile=compileFn;
})();

/* =========================================================
   COLOURS
   ========================================================= */
const COLORS=['#2563eb','#dc2626','#16a34a','#9333ea','#ea580c','#0891b2','#be185d','#ca8a04'];

/* =========================================================
   STATE
   ========================================================= */
let functions=[
  {expr:'2*x+3',   color:COLORS[0], fn:null, error:null},
  {expr:'x^2-4',   color:COLORS[1], fn:null, error:null},
];
let viewport={xmin:-10,xmax:10,ymin:-10,ymax:10};
let traceX=null;
let analysisPoints=[]; // {x,y,type,label,color}

/* =========================================================
   DOM HELPERS
   ========================================================= */
const $ = id => document.getElementById(id);
const FUNC_LIST=$('funcList');
const GRAPH_SVG=$('graphSvg');
const LEGEND=$('legend');

/* =========================================================
   FUNCTION LIST UI
   ========================================================= */
function rebuildFuncList(){
  FUNC_LIST.innerHTML='';
  functions.forEach((f,i)=>{
    const row=document.createElement('div');
    row.className='func-row';
    row.innerHTML=`
      <div class="color-dot" style="background:${f.color};border:2px solid #fff;box-shadow:0 0 0 1.5px ${f.color};"></div>
      <input type="text" class="border border-gray-300 rounded px-2 py-1 flex-1 text-sm font-mono"
             placeholder="f.eks. 2x+3" value="${f.expr}" data-idx="${i}" />
      ${functions.length>1?`<button class="text-gray-400 hover:text-red-500 text-lg leading-none font-bold" data-del="${i}">×</button>`:''}
    `;
    FUNC_LIST.appendChild(row);
    if(f.error){
      const err=document.createElement('div');
      err.className='error-msg pl-5';
      err.textContent=f.error;
      FUNC_LIST.appendChild(err);
    }
  });

  // events
  FUNC_LIST.querySelectorAll('input[data-idx]').forEach(inp=>{
    inp.addEventListener('input',e=>{
      functions[+e.target.dataset.idx].expr=e.target.value.trim();
      functions[+e.target.dataset.idx].error=null;
    });
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') compileAndPlot(); });
  });
  FUNC_LIST.querySelectorAll('button[data-del]').forEach(btn=>{
    btn.addEventListener('click',e=>{
      functions.splice(+e.target.dataset.del,1);
      rebuildFuncList();
      rebuildSelects();
    });
  });
}

$('addFuncBtn').addEventListener('click',()=>{
  if(functions.length>=8) return;
  functions.push({expr:'',color:COLORS[functions.length%COLORS.length],fn:null,error:null});
  rebuildFuncList();
  rebuildSelects();
});

/* =========================================================
   COMPILE FUNCTIONS
   ========================================================= */
function compileAll(){
  let ok=true;
  functions.forEach(f=>{
    f.error=null;
    if(!f.expr){f.fn=null;return;}
    try{
      f.fn=window._graftegner_compile(f.expr);
    } catch(e){
      f.fn=null; f.error=e.message; ok=false;
    }
  });
  rebuildFuncList();
  $('parseError').textContent='';
  return ok;
}

/* =========================================================
   SELECTS (analysis + verditabell)
   ========================================================= */
function rebuildSelects(){
  const ids=['nullpktFunc','skjFunc1','skjFunc2','tabFunc'];
  ids.forEach(id=>{
    const sel=$(id);
    const prev=sel.value;
    sel.innerHTML='';
    functions.forEach((f,i)=>{
      const label=f.expr||`f${i+1}`;
      sel.innerHTML+=`<option value="${i}">${label}</option>`;
    });
    if(prev!==''&&$(id).querySelector(`option[value="${prev}"]`)) sel.value=prev;
  });
}

/* =========================================================
   VIEWPORT helpers
   ========================================================= */
function readViewport(){
  const xmin=parseFloat($('xmin').value)||viewport.xmin;
  const xmax=parseFloat($('xmax').value)||viewport.xmax;
  const ymin=parseFloat($('ymin').value)||viewport.ymin;
  const ymax=parseFloat($('ymax').value)||viewport.ymax;
  if(xmin<xmax&&ymin<ymax){
    viewport={xmin,xmax,ymin,ymax};
  }
}

function writeViewport(){
  $('xmin').value=viewport.xmin;
  $('xmax').value=viewport.xmax;
  $('ymin').value=viewport.ymin;
  $('ymax').value=viewport.ymax;
}

$('zoomInBtn').addEventListener('click',()=>{
  readViewport();
  const cx=(viewport.xmin+viewport.xmax)/2, cy=(viewport.ymin+viewport.ymax)/2;
  const hw=(viewport.xmax-viewport.xmin)*0.35, hh=(viewport.ymax-viewport.ymin)*0.35;
  viewport={xmin:cx-hw,xmax:cx+hw,ymin:cy-hh,ymax:cy+hh};
  writeViewport(); compileAndPlot();
});
$('zoomOutBtn').addEventListener('click',()=>{
  readViewport();
  const cx=(viewport.xmin+viewport.xmax)/2, cy=(viewport.ymin+viewport.ymax)/2;
  const hw=(viewport.xmax-viewport.xmin)*0.7, hh=(viewport.ymax-viewport.ymin)*0.7;
  viewport={xmin:cx-hw,xmax:cx+hw,ymin:cy-hh,ymax:cy+hh};
  writeViewport(); compileAndPlot();
});
$('resetBtn').addEventListener('click',()=>{
  viewport={xmin:-10,xmax:10,ymin:-10,ymax:10};
  writeViewport(); analysisPoints=[]; traceX=null; compileAndPlot();
});

/* =========================================================
   PLOT
   ========================================================= */
function compileAndPlot(){
  readViewport();
  compileAll();
  rebuildSelects();
  drawGraph();
}

$('plotBtn').addEventListener('click', compileAndPlot);

/* =========================================================
   NUMERICAL HELPERS
   ========================================================= */
// Find roots of f in [a,b] with bisection, collecting sign changes
function findRoots(fn, xmin, xmax, steps){
  const roots=[];
  const dx=(xmax-xmin)/steps;
  let x0=xmin, y0;
  try{ y0=fn(x0); } catch(e){ y0=NaN; }
  for(let i=1;i<=steps;i++){
    const x1=xmin+i*dx;
    let y1;
    try{ y1=fn(x1); } catch(e){ y1=NaN; }
    if(!isFinite(y0)||!isFinite(y1)){x0=x1;y0=y1;continue;}
    if(Math.abs(y0)<1e-10){ roots.push(x0); x0=x1;y0=y1;continue; }
    if(y0*y1<0){
      // bisect
      let lo=x0,hi=x1,flo=y0;
      for(let k=0;k<52;k++){
        const mid=(lo+hi)/2;
        let fm;
        try{ fm=fn(mid); } catch(e){ break; }
        if(!isFinite(fm)) break;
        if(Math.abs(fm)<1e-12){lo=mid;break;}
        if(flo*fm<0){hi=mid;}else{lo=mid;flo=fm;}
      }
      roots.push((lo+hi)/2);
    }
    x0=x1; y0=y1;
  }
  // deduplicate
  const unique=[];
  roots.forEach(r=>{
    if(unique.every(u=>Math.abs(u-r)>1e-6)) unique.push(r);
  });
  return unique;
}

function findIntersections(fn1,fn2,xmin,xmax){
  const diff=x=>fn1(x)-fn2(x);
  return findRoots(diff,xmin,xmax,2000);
}

   ANALYSIS ACTIONS
   ========================================================= */
// Tabs
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click',function(){
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    this.classList.add('active');
    const tab=this.dataset.tab;
    $('tab-nullpunkt').classList.add('hidden');
    $('tab-skjaering').classList.add('hidden');
    $('tab-'+tab).classList.remove('hidden');
    $('resultList').innerHTML='';
  });
});

$('findNullpktBtn').addEventListener('click',()=>{
  compileAll();
  readViewport();
  const idx=+$('nullpktFunc').value;
  const f=functions[idx];
  if(!f||!f.fn){ showResults([],[],'Ingen gyldig funksjon valgt.'); return; }
  const roots=findRoots(f.fn,viewport.xmin,viewport.xmax,4000);
  const pts=roots.map(rx=>({x:rx,y:0,type:'nullpunkt',label:`Nullpunkt`,color:f.color}));
  analysisPoints=pts;
  const lines=roots.length===0
    ?['Ingen nullpunkt funnet i visningsvinduet.']
    :roots.map(rx=>`x = ${fmt(rx)}  →  (${fmt(rx)}, 0)`);
  showResults(lines, pts.length===0?[{text:'Ingen nullpunkt',color:f.color}]:null);
  drawGraph();
});

$('findSkjBtn').addEventListener('click',()=>{
  compileAll();
  readViewport();
  const i1=+$('skjFunc1').value, i2=+$('skjFunc2').value;
  if(i1===i2){ showResults(['Velg to ulike funksjoner.'],null); return; }
  const f1=functions[i1],f2=functions[i2];
  if(!f1||!f1.fn||!f2||!f2.fn){ showResults(['En eller begge funksjoner er ugyldige.'],null); return; }
  const xs=findIntersections(f1.fn,f2.fn,viewport.xmin,viewport.xmax);
  const pts=xs.map(rx=>{
    let ry;
    try{ ry=f1.fn(rx); } catch(e){ ry=NaN; }
    return {x:rx,y:ry,type:'skjaering',label:'Skjæringspunkt',color:'#f59e0b'};
  });
  analysisPoints=pts;
  const lines=pts.length===0
    ?['Ingen skjæringspunkt funnet i visningsvinduet.']
    :pts.map(p=>`(${fmt(p.x)}, ${fmt(p.y)})`);
  showResults(lines,null);
  drawGraph();
});

function showResults(lines,_unused){
  const ul=$('resultList');
  ul.innerHTML='';
  lines.forEach(l=>{
    const li=document.createElement('li');
    li.textContent=l;
    ul.appendChild(li);
  });
}

/* =========================================================
   TRACE
   ========================================================= */
$('traceBtn').addEventListener('click',()=>{
  compileAll();
  const xv=parseFloat($('traceX').value);
  if(!isFinite(xv)){ $('traceResult').innerHTML='<li class="error-msg">Ugyldig x-verdi.</li>'; traceX=null; drawGraph(); return; }
  traceX=xv;
  const ul=$('traceResult');
  ul.innerHTML='';
  functions.forEach((f,i)=>{
    if(!f.fn||!f.expr) return;
    let y;
    try{ y=f.fn(xv); } catch(e){ y=NaN; }
    const li=document.createElement('li');
    li.innerHTML=`<span style="color:${f.color};font-weight:700;">f${i+1}(${fmt(xv)})</span> = ${isFinite(y)?fmt(y):'udefinert'}`;
    ul.appendChild(li);
  });
  drawGraph();
});

/* =========================================================
   VERDITABELL
   ========================================================= */
$('buildTabBtn').addEventListener('click',()=>{
  compileAll();
  const idx=+$('tabFunc').value;
  const f=functions[idx];
  if(!f||!f.fn){ $('verditabellWrap').innerHTML='<span class="error-msg">Ingen gyldig funksjon.</span>'; return; }
  const fra=parseFloat($('tabXfra').value);
  const til=parseFloat($('tabXtil').value);
  let steg=parseFloat($('tabSteg').value);
  if(!isFinite(fra)||!isFinite(til)||!isFinite(steg)||steg<=0||fra>=til){
    $('verditabellWrap').innerHTML='<span class="error-msg">Ugyldig område eller steg.</span>'; return;
  }
  // clamp max rows
  const n=Math.round((til-fra)/steg)+1;
  if(n>200){ $('verditabellWrap').innerHTML='<span class="error-msg">For mange rader (maks 200). Øk steget.</span>'; return; }
  let html='<table class="verditabell"><thead><tr><th>x</th><th>f(x)</th></tr></thead><tbody>';
  for(let k=0;k<n;k++){
    const x=fra+k*steg;
    let y;
    try{ y=f.fn(x); } catch(e){ y=NaN; }
    html+=`<tr><td>${fmt(x)}</td><td>${isFinite(y)?fmt(y):'udefinert'}</td></tr>`;
  }
  html+='</tbody></table>';
  $('verditabellWrap').innerHTML=html;
});

/* =========================================================
   FORMAT number
   ========================================================= */
function fmt(v){ return Math.abs(v)<1e-10?'0':parseFloat(v.toPrecision(6)).toString(); }

/* =========================================================
   DRAW
   ========================================================= */
function drawGraph(){
  const svgEl=GRAPH_SVG;
  const W=svgEl.clientWidth||600;
  const H=svgEl.clientHeight||480;
  const PAD={top:20,right:20,bottom:36,left:44};
  const gW=W-PAD.left-PAD.right;
  const gH=H-PAD.top-PAD.bottom;

  const {xmin,xmax,ymin,ymax}=viewport;
  const xRange=xmax-xmin, yRange=ymax-ymin;

  function sx(x){ return PAD.left+(x-xmin)/xRange*gW; }
  function sy(y){ return PAD.top+(ymax-y)/yRange*gH; }
  function worldX(px){ return xmin+(px-PAD.left)/gW*xRange; }
  function worldY(py){ return ymax-(py-PAD.top)/gH*yRange; }

  // nice tick spacing
  function niceTick(range, pixels){
    const ideal=pixels/60;
    const raw=range/ideal;
    const pow=Math.pow(10,Math.floor(Math.log10(raw)));
    for(const f of [1,2,2.5,5,10]){
      if(raw<=f*pow) return f*pow;
    }
    return 10*pow;
  }
  const xTick=niceTick(xRange,gW);
  const yTick=niceTick(yRange,gH);

  let svg=`<defs></defs>`;

  // Background
  svg+=`<rect x="0" y="0" width="${W}" height="${H}" fill="#f9fafb"/>`;
  svg+=`<rect x="${PAD.left}" y="${PAD.top}" width="${gW}" height="${gH}" fill="white" stroke="#e5e7eb" stroke-width="1"/>`;

  // Grid & ticks
  const xStart=Math.ceil(xmin/xTick)*xTick;
  const yStart=Math.ceil(ymin/yTick)*yTick;

  for(let x=xStart;x<=xmax+1e-9;x+=xTick){
    const px=sx(x);
    if(px<PAD.left||px>PAD.left+gW) continue;
    svg+=`<line x1="${px}" y1="${PAD.top}" x2="${px}" y2="${PAD.top+gH}" class="grid-line"/>`;
    const label=fmt(x);
    if(Math.abs(x)>1e-9)
      svg+=`<text x="${px}" y="${PAD.top+gH+14}" text-anchor="middle" class="tick-label">${label}</text>`;
  }
  for(let y=yStart;y<=ymax+1e-9;y+=yTick){
    const py=sy(y);
    if(py<PAD.top||py>PAD.top+gH) continue;
    svg+=`<line x1="${PAD.left}" y1="${py}" x2="${PAD.left+gW}" y2="${py}" class="grid-line"/>`;
    const label=fmt(y);
    if(Math.abs(y)>1e-9)
      svg+=`<text x="${PAD.left-4}" y="${py+4}" text-anchor="end" class="tick-label">${label}</text>`;
  }

  // Axes
  if(ymin<=0&&ymax>=0){
    const py=sy(0);
    svg+=`<line x1="${PAD.left}" y1="${py}" x2="${PAD.left+gW}" y2="${py}" class="axis-line"/>`;
    svg+=`<text x="${PAD.left+gW+4}" y="${py+4}" class="tick-label" font-weight="bold">x</text>`;
  }
  if(xmin<=0&&xmax>=0){
    const px=sx(0);
    svg+=`<line x1="${px}" y1="${PAD.top}" x2="${px}" y2="${PAD.top+gH}" class="axis-line"/>`;
    svg+=`<text x="${px}" y="${PAD.top-6}" text-anchor="middle" class="tick-label" font-weight="bold">y</text>`;
  }
  // Origin label
  if(xmin<=0&&xmax>=0&&ymin<=0&&ymax>=0){
    svg+=`<text x="${sx(0)-5}" y="${sy(0)+13}" class="tick-label">0</text>`;
  }

  // Clip path
  svg+=`<clipPath id="graphClip"><rect x="${PAD.left}" y="${PAD.top}" width="${gW}" height="${gH}"/></clipPath>`;

  // Function curves
  const STEPS=Math.min(Math.ceil(gW*2),2000);
  const activeFns=functions.filter(f=>f.fn&&f.expr);

  activeFns.forEach((f,fi)=>{
    const pts=[];
    for(let k=0;k<=STEPS;k++){
      const x=xmin+k/STEPS*xRange;
      let y;
      try{ y=f.fn(x); } catch(e){ y=NaN; }
      pts.push([x,y]);
    }
    // Build SVG path segments, breaking on discontinuities
    let d='';
    let inSeg=false;
    for(let k=0;k<pts.length;k++){
      const [x,y]=pts[k];
      if(!isFinite(y)){inSeg=false;continue;}
      // Check large jump (possible asymptote)
      if(inSeg&&k>0&&isFinite(pts[k-1][1])){
        const dy=Math.abs(y-pts[k-1][1]);
        if(dy>yRange*3){ inSeg=false; }
      }
      const px=sx(x), py=sy(y);
      if(!inSeg){ d+=`M${px.toFixed(2)},${py.toFixed(2)}`; inSeg=true; }
      else { d+=`L${px.toFixed(2)},${py.toFixed(2)}`; }
    }
    if(d){
      svg+=`<path d="${d}" fill="none" stroke="${f.color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" clip-path="url(#graphClip)"/>`;
    }
  });

  // Trace line
  if(traceX!==null&&isFinite(traceX)&&traceX>=xmin&&traceX<=xmax){
    const px=sx(traceX);
    svg+=`<line x1="${px}" y1="${PAD.top}" x2="${px}" y2="${PAD.top+gH}" class="trace-line" clip-path="url(#graphClip)"/>`;
    activeFns.forEach(f=>{
      let y;
      try{ y=f.fn(traceX); } catch(e){ y=NaN; }
      if(isFinite(y)&&y>=ymin&&y<=ymax){
        const py=sy(y);
        svg+=`<circle cx="${px}" cy="${py}" r="5" fill="${f.color}" stroke="white" stroke-width="2" clip-path="url(#graphClip)"/>`;
        const lx=px+8, ly=py-4;
        svg+=`<text x="${lx}" y="${ly}" fill="${f.color}" font-size="11" font-weight="600">(${fmt(traceX)}, ${fmt(y)})</text>`;
      }
    });
  }

  // Analysis points
  analysisPoints.forEach(p=>{
    if(!isFinite(p.x)||!isFinite(p.y)) return;
    if(p.x<xmin||p.x>xmax||p.y<ymin||p.y>ymax) return;
    const px=sx(p.x), py=sy(p.y);
    svg+=`<circle cx="${px}" cy="${py}" r="6" fill="white" stroke="${p.color}" stroke-width="2.5" clip-path="url(#graphClip)"/>`;
    svg+=`<circle cx="${px}" cy="${py}" r="2.5" fill="${p.color}" clip-path="url(#graphClip)"/>`;
    const lx=px+8, ly=py-8;
    svg+=`<text x="${lx}" y="${ly}" fill="${p.color}" font-size="11" font-weight="600">(${fmt(p.x)}, ${fmt(p.y)})</text>`;
  });

  svgEl.innerHTML=svg;

  // Legend
  if(activeFns.length>0){
    LEGEND.classList.remove('hidden');
    LEGEND.innerHTML=activeFns.map((f,i)=>`
      <div style="display:flex;align-items:center;gap:6px;">
        <svg width="22" height="8"><line x1="0" y1="4" x2="22" y2="4" stroke="${f.color}" stroke-width="2.2" stroke-linecap="round"/></svg>
        <span style="color:${f.color};font-weight:700;">f${i+1}(x)</span>
        <span style="color:#374151;font-family:monospace;font-size:11px;"> = ${f.expr}</span>
      </div>
    `).join('');
  } else {
    LEGEND.classList.add('hidden');
  }
}

/* =========================================================
   MOUSE / TOUCH: drag to pan
   ========================================================= */
(function(){
  let dragging=false, startPx=0, startPy=0, startVP=null;
  GRAPH_SVG.addEventListener('mousedown',e=>{
    dragging=true;
    startPx=e.clientX; startPy=e.clientY;
    startVP={...viewport};
    e.preventDefault();
  });
  window.addEventListener('mousemove',e=>{
    if(!dragging) return;
    const W=GRAPH_SVG.clientWidth||600;
    const H=GRAPH_SVG.clientHeight||480;
    const PAD={top:20,right:20,bottom:36,left:44};
    const gW=W-PAD.left-PAD.right;
    const gH=H-PAD.top-PAD.bottom;
    const dx=(e.clientX-startPx)/gW*(startVP.xmax-startVP.xmin);
    const dy=(e.clientY-startPy)/gH*(startVP.ymax-startVP.ymin);
    viewport.xmin=startVP.xmin-dx;
    viewport.xmax=startVP.xmax-dx;
    viewport.ymin=startVP.ymin+dy;
    viewport.ymax=startVP.ymax+dy;
    writeViewport();
    drawGraph();
  });
  window.addEventListener('mouseup',()=>{ dragging=false; });

  // Wheel zoom
  GRAPH_SVG.addEventListener('wheel',e=>{
    e.preventDefault();
    readViewport();
    const rect=GRAPH_SVG.getBoundingClientRect();
    const W=GRAPH_SVG.clientWidth||600;
    const H=GRAPH_SVG.clientHeight||480;
    const PAD={top:20,right:20,bottom:36,left:44};
    const gW=W-PAD.left-PAD.right;
    const gH=H-PAD.top-PAD.bottom;
    const mx=(e.clientX-rect.left-PAD.left)/gW*(viewport.xmax-viewport.xmin)+viewport.xmin;
    const my=viewport.ymax-(e.clientY-rect.top-PAD.top)/gH*(viewport.ymax-viewport.ymin);
    const factor=e.deltaY>0?1.15:0.87;
    viewport.xmin=mx+(viewport.xmin-mx)*factor;
    viewport.xmax=mx+(viewport.xmax-mx)*factor;
    viewport.ymin=my+(viewport.ymin-my)*factor;
    viewport.ymax=my+(viewport.ymax-my)*factor;
    writeViewport();
    drawGraph();
  },{passive:false});
})();

/* =========================================================
   RESIZE observer
   ========================================================= */
if(window.ResizeObserver){
  new ResizeObserver(()=>{ drawGraph(); }).observe(GRAPH_SVG.parentElement);
}

/* =========================================================
   INIT
   ========================================================= */
rebuildFuncList();
writeViewport();
compileAndPlot();
</script>
