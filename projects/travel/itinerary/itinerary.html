  A day-by-day trip planner: build each day of your trip as a timeline of
  activities with times, places, and notes. Saves to your browser.

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Itinerary Planner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Segoe UI', system-ui, sans-serif; }

    /* Timeline vertical line */
    .timeline-track {
      position: relative;
    }
    .timeline-track::before {
      content: '';
      position: absolute;
      left: 23px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #e2e8f0;
      z-index: 0;
    }

    /* Activity dot */
    .activity-dot {
      position: relative;
      z-index: 1;
      flex-shrink: 0;
      width: 48px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 2px;
    }

    /* Subtle scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

    /* Activity type colors */
    .type-travel  { background: #dbeafe; color: #1e40af; border-color: #93c5fd; }
    .type-food    { background: #fef3c7; color: #92400e; border-color: #fcd34d; }
    .type-sight   { background: #d1fae5; color: #065f46; border-color: #6ee7b7; }
    .type-stay    { background: #ede9fe; color: #5b21b6; border-color: #c4b5fd; }
    .type-other   { background: #f1f5f9; color: #475569; border-color: #cbd5e1; }

    /* Edit form */
    .edit-form { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 0.75rem; }

    /* Modal backdrop */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 50;
      display: flex; align-items: center; justify-content: center;
    }

    /* Category badge pill */
    .cat-pill {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 0.7rem; font-weight: 600;
      padding: 1px 8px; border-radius: 9999px; border-width: 1px;
      white-space: nowrap;
    }

    input[type="date"]::-webkit-calendar-picker-indicator {
      opacity: 0.7; cursor: pointer;
    }

    /* Day column sticky header */
    .day-header-sticky {
      position: sticky; top: 0; z-index: 10;
    }

    /* No scrollbar in day list when many days */
    .days-scroll { overflow-y: auto; }

    /* Compact summary strip */
    .summary-bar { background: #1e293b; color: #e2e8f0; }

    /* Drag handle cursor */
    .drag-handle { cursor: grab; }

    /* Activity card hover */
    .activity-card { transition: box-shadow 0.15s; }
    .activity-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.09); }

    /* Responsive layout: single column on small, two-pane on md+ */
    @media (min-width: 768px) {
      #layout { display: grid; grid-template-columns: 260px 1fr; }
    }
    @media (max-width: 767px) {
      #layout { display: block; }
      #day-sidebar { border-right: none; border-bottom: 1px solid #e2e8f0; }
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col" style="height:100vh; overflow:hidden;">

<!-- ===== TOP BAR ===== -->
<header class="bg-slate-900 text-white flex-shrink-0 shadow-lg">
  <div class="max-w-screen-xl mx-auto px-4 py-3 flex flex-wrap items-center gap-3">
    <!-- App icon + title -->
    <div class="flex items-center gap-2 mr-2">
      <span style="font-size:1.5rem;">🗺️</span>
      <span class="text-xl font-bold tracking-tight">Itinerary</span>
    </div>

    <!-- Trip name -->
    <input id="tripName" type="text" maxlength="80" placeholder="Trip name…"
      oninput="saveTrip()"
      class="flex-1 min-w-[140px] max-w-xs bg-slate-700 text-white placeholder-slate-400 rounded-lg px-3 py-1.5 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-blue-400" />

    <!-- Start date -->
    <label class="text-xs text-slate-400 flex items-center gap-1.5 whitespace-nowrap">
      <span>Start</span>
      <input id="startDate" type="date"
        oninput="saveTrip(); renderDays();"
        class="bg-slate-700 text-white rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
    </label>

    <!-- Summary strip inline -->
    <div id="topSummary" class="ml-auto text-xs text-slate-400 hidden md:flex items-center gap-4"></div>

    <!-- Reset button -->
    <button onclick="confirmReset()"
      class="ml-1 px-3 py-1.5 rounded-lg bg-slate-700 hover:bg-red-800 text-slate-300 hover:text-white text-xs transition-colors">
      Reset
    </button>
  </div>
</header>

<!-- ===== MAIN LAYOUT ===== -->
<div id="layout" class="flex-1 overflow-hidden" style="min-height:0;">

  <!-- ---- DAY SIDEBAR ---- -->
  <aside id="day-sidebar" class="bg-white border-r border-slate-200 flex flex-col overflow-hidden">
    <!-- sidebar header -->
    <div class="px-3 py-2 border-b border-slate-100 flex items-center justify-between flex-shrink-0">
      <span class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Days</span>
      <div class="flex gap-1">
        <button onclick="addDay()"
          title="Add a day"
          class="px-2 py-1 rounded bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold transition-colors">+ Day</button>
        <button onclick="removeLastDay()"
          title="Remove last day"
          class="px-2 py-1 rounded bg-slate-200 hover:bg-red-100 hover:text-red-700 text-slate-600 text-xs font-semibold transition-colors">−</button>
      </div>
    </div>

    <!-- day list -->
    <div id="dayList" class="flex-1 overflow-y-auto py-1"></div>

    <!-- summary at bottom of sidebar -->
    <div id="sidebarSummary" class="border-t border-slate-100 px-3 py-2 text-xs text-slate-500 flex-shrink-0"></div>
  </aside>

  <!-- ---- DAY DETAIL PANE ---- -->
  <main id="dayDetail" class="flex-1 overflow-y-auto bg-slate-50">
    <!-- filled by renderDetail() -->
  </main>
</div>

<!-- ===== RESET MODAL ===== -->
<div id="resetModal" class="modal-backdrop hidden">
  <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full mx-4 p-6">
    <h2 class="text-lg font-bold text-slate-800 mb-2">Reset all data?</h2>
    <p class="text-sm text-slate-500 mb-5">This will permanently delete your trip, all days, and all activities. This cannot be undone.</p>
    <div class="flex gap-3 justify-end">
      <button onclick="closeModal()"
        class="px-4 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold transition-colors">Cancel</button>
      <button onclick="doReset()"
        class="px-4 py-2 rounded-lg bg-red-600 hover:bg-red-700 text-white text-sm font-semibold transition-colors">Yes, reset</button>
    </div>
  </div>
</div>

<!-- ===== MOVE-ACTIVITY MODAL ===== -->
<div id="moveModal" class="modal-backdrop hidden">
  <div class="bg-white rounded-2xl shadow-2xl max-w-xs w-full mx-4 p-6">
    <h2 class="text-base font-bold text-slate-800 mb-3">Move activity to day…</h2>
    <div id="moveDayList" class="flex flex-col gap-2 max-h-64 overflow-y-auto mb-4"></div>
    <button onclick="closeMoveModal()"
      class="w-full px-4 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold transition-colors">Cancel</button>
  </div>
</div>

<script>
/* ================================================================
   DATA MODEL
   trip: { name, startDate, days: [ { id, activities: [...] } ] }
   activity: { id, time, title, location, type, notes }
   ================================================================ */

const TYPES = {
  travel:  { label: 'Travel',        emoji: '✈️' },
  food:    { label: 'Food & Drink',   emoji: '🍽️' },
  sight:   { label: 'Sightseeing',   emoji: '🏛️' },
  stay:    { label: 'Accommodation', emoji: '🏨' },
  other:   { label: 'Other',         emoji: '📌' },
};

const STORAGE_KEY = 'itinerary_v1';

/* ---- State ---- */
let trip = null;
let selectedDayIdx = 0;
let pendingMoveActivity = null; // { dayIdx, activityId }

/* ================================================================
   PERSISTENCE
   ================================================================ */
function loadTrip() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { trip = JSON.parse(raw); return; }
  } catch(e) {}
  trip = defaultTrip();
}

function saveTrip() {
  // Pull header values into trip object
  const nameEl = document.getElementById('tripName');
  const dateEl = document.getElementById('startDate');
  if (nameEl) trip.name = nameEl.value;
  if (dateEl) trip.startDate = dateEl.value;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(trip));
}

/* ================================================================
   DEFAULT / STARTER TRIP
   ================================================================ */
function defaultTrip() {
  // A 3-day city trip to Rome — gives the user a realistic starting point
  const startDate = '2024-09-12';
  return {
    name: 'Rome City Break',
    startDate,
    days: [
      {
        id: uid(),
        activities: [
          { id: uid(), time: '09:30', title: 'Fly to Rome (FCO)', location: 'Fiumicino Airport', type: 'travel', notes: 'Flight FR1234. Check-in online.' },
          { id: uid(), time: '13:00', title: 'Transfer to hotel', location: 'Roma Termini', type: 'travel', notes: 'Take the Leonardo Express (32 min).' },
          { id: uid(), time: '14:30', title: 'Check in', location: 'Hotel Artemide, Via Nazionale', type: 'stay', notes: 'Early check-in requested.' },
          { id: uid(), time: '17:00', title: 'Evening stroll — Trevi Fountain', location: 'Piazza di Trevi', type: 'sight', notes: 'Visit before sunset, less crowded.' },
          { id: uid(), time: '19:30', title: 'Dinner at Tonnarello', location: 'Trastevere', type: 'food', notes: 'Cacio e pepe. Book ahead.' },
        ]
      },
      {
        id: uid(),
        activities: [
          { id: uid(), time: '08:30', title: 'Breakfast at the hotel', location: 'Hotel Artemide', type: 'food', notes: '' },
          { id: uid(), time: '10:00', title: 'Vatican Museums & Sistine Chapel', location: 'Vatican City', type: 'sight', notes: 'Pre-booked skip-the-line ticket.' },
          { id: uid(), time: '13:30', title: 'Lunch near St Peter\'s', location: 'Borgo Pio', type: 'food', notes: 'Budget ~€15 pp.' },
          { id: uid(), time: '15:00', title: 'St Peter\'s Basilica', location: 'Vatican City', type: 'sight', notes: 'Climb the dome for panoramic views.' },
          { id: uid(), time: '19:00', title: 'Aperitivo', location: 'Prati neighbourhood', type: 'food', notes: '' },
        ]
      },
      {
        id: uid(),
        activities: [
          { id: uid(), time: '09:00', title: 'Colosseum & Roman Forum', location: 'Piazza del Colosseo', type: 'sight', notes: 'Combo ticket covers Palatine Hill.' },
          { id: uid(), time: '13:00', title: 'Lunch at Roscioli', location: 'Via dei Giubbonari', type: 'food', notes: 'Famous for salumi and cheese.' },
          { id: uid(), time: '15:00', title: 'Piazza Navona & Campo de\' Fiori', location: 'Historic centre', type: 'sight', notes: '' },
          { id: uid(), time: '17:30', title: 'Check out & transfer to airport', location: 'Fiumicino Airport', type: 'travel', notes: 'Allow 90 min for transfer.' },
          { id: uid(), time: '20:45', title: 'Fly home', location: 'Fiumicino Airport (FCO)', type: 'travel', notes: '' },
        ]
      }
    ]
  };
}

/* ================================================================
   UTILITIES
   ================================================================ */
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function dayLabel(trip, idx) {
  if (!trip.startDate) return `Day ${idx + 1}`;
  try {
    // Parse the date as local to avoid UTC-offset day shift
    const [y, m, d] = trip.startDate.split('-').map(Number);
    const base = new Date(y, m - 1, d);
    base.setDate(base.getDate() + idx);
    const weekday = base.toLocaleDateString('en-GB', { weekday: 'short' });
    const dateStr = base.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    return `${weekday} ${dateStr}`;
  } catch(e) {
    return `Day ${idx + 1}`;
  }
}

function sortActivities(acts) {
  return [...acts].sort((a, b) => {
    if (!a.time && !b.time) return 0;
    if (!a.time) return 1;
    if (!b.time) return -1;
    return a.time.localeCompare(b.time);
  });
}

function typeCss(type) {
  const map = {
    travel: 'type-travel',
    food:   'type-food',
    sight:  'type-sight',
    stay:   'type-stay',
    other:  'type-other',
  };
  return map[type] || 'type-other';
}

function countByType(days) {
  const counts = {};
  for (const t of Object.keys(TYPES)) counts[t] = 0;
  for (const day of days) {
    for (const act of day.activities) {
      if (counts[act.type] !== undefined) counts[act.type]++;
      else counts.other = (counts.other || 0) + 1;
    }
  }
  return counts;
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ================================================================
   TRIP-LEVEL ACTIONS
   ================================================================ */
function addDay() {
  trip.days.push({ id: uid(), activities: [] });
  saveTrip();
  selectedDayIdx = trip.days.length - 1;
  renderDays();
  renderDetail();
  updateSummary();
}

function removeLastDay() {
  if (trip.days.length === 0) return;
  if (!confirm(`Remove Day ${trip.days.length}? All activities in that day will be lost.`)) return;
  trip.days.pop();
  if (selectedDayIdx >= trip.days.length) selectedDayIdx = Math.max(0, trip.days.length - 1);
  saveTrip();
  renderDays();
  renderDetail();
  updateSummary();
}

/* ================================================================
   ACTIVITY ACTIONS
   ================================================================ */
function addActivity(dayIdx) {
  const day = trip.days[dayIdx];
  if (!day) return;
  const newAct = { id: uid(), time: '', title: '', location: '', type: 'sight', notes: '' };
  day.activities.push(newAct);
  saveTrip();
  renderDetail();
  // Auto-open edit form for the new activity
  setTimeout(() => openEditForm(dayIdx, newAct.id), 30);
}

function deleteActivity(dayIdx, actId) {
  const day = trip.days[dayIdx];
  if (!day) return;
  day.activities = day.activities.filter(a => a.id !== actId);
  saveTrip();
  renderDetail();
  updateSummary();
}

function moveActivityUp(dayIdx, actId) {
  const day = trip.days[dayIdx];
  const sorted = sortActivities(day.activities);
  const idx = sorted.findIndex(a => a.id === actId);
  if (idx <= 0) return;
  // Swap times if both have times, else swap positions in the raw array
  const rawIdx = day.activities.findIndex(a => a.id === actId);
  const prevId = sorted[idx - 1].id;
  const prevRawIdx = day.activities.findIndex(a => a.id === prevId);
  const tmp = day.activities[rawIdx];
  day.activities[rawIdx] = day.activities[prevRawIdx];
  day.activities[prevRawIdx] = tmp;
  saveTrip();
  renderDetail();
}

function moveActivityDown(dayIdx, actId) {
  const day = trip.days[dayIdx];
  const sorted = sortActivities(day.activities);
  const idx = sorted.findIndex(a => a.id === actId);
  if (idx < 0 || idx >= sorted.length - 1) return;
  const rawIdx = day.activities.findIndex(a => a.id === actId);
  const nextId = sorted[idx + 1].id;
  const nextRawIdx = day.activities.findIndex(a => a.id === nextId);
  const tmp = day.activities[rawIdx];
  day.activities[rawIdx] = day.activities[nextRawIdx];
  day.activities[nextRawIdx] = tmp;
  saveTrip();
  renderDetail();
}

function saveActivityFromForm(dayIdx, actId) {
  const day = trip.days[dayIdx];
  const act = day.activities.find(a => a.id === actId);
  if (!act) return;
  act.time     = document.getElementById(`f-time-${actId}`)?.value || '';
  act.title    = document.getElementById(`f-title-${actId}`)?.value || '';
  act.location = document.getElementById(`f-loc-${actId}`)?.value || '';
  act.type     = document.getElementById(`f-type-${actId}`)?.value || 'other';
  act.notes    = document.getElementById(`f-notes-${actId}`)?.value || '';
  saveTrip();
  renderDetail();
  updateSummary();
}

function openEditForm(dayIdx, actId) {
  // Show the inline form for a specific activity
  const el = document.getElementById(`edit-${actId}`);
  if (el) {
    el.classList.remove('hidden');
    el.querySelector(`#f-title-${actId}`)?.focus();
  }
}

function closeEditForm(actId) {
  const el = document.getElementById(`edit-${actId}`);
  if (el) el.classList.add('hidden');
}

/* ================================================================
   MOVE TO ANOTHER DAY
   ================================================================ */
function openMoveModal(dayIdx, actId) {
  pendingMoveActivity = { dayIdx, actId };
  const container = document.getElementById('moveDayList');
  container.innerHTML = '';
  trip.days.forEach((day, i) => {
    if (i === dayIdx) return;
    const label = `Day ${i + 1} — ${dayLabel(trip, i)}`;
    const btn = document.createElement('button');
    btn.className = 'px-3 py-2 rounded-lg bg-slate-100 hover:bg-blue-50 hover:text-blue-700 text-sm text-left transition-colors';
    btn.textContent = label;
    btn.onclick = () => { doMoveActivity(i); };
    container.appendChild(btn);
  });
  if (trip.days.length <= 1) {
    container.innerHTML = '<p class="text-sm text-slate-400">No other days to move to.</p>';
  }
  document.getElementById('moveModal').classList.remove('hidden');
}

function doMoveActivity(targetDayIdx) {
  if (!pendingMoveActivity) return;
  const { dayIdx, actId } = pendingMoveActivity;
  const fromDay = trip.days[dayIdx];
  const toDay   = trip.days[targetDayIdx];
  const actIdx  = fromDay.activities.findIndex(a => a.id === actId);
  if (actIdx < 0) { closeMoveModal(); return; }
  const [act] = fromDay.activities.splice(actIdx, 1);
  toDay.activities.push(act);
  saveTrip();
  closeMoveModal();
  renderDetail();
  updateSummary();
}

function closeMoveModal() {
  pendingMoveActivity = null;
  document.getElementById('moveModal').classList.add('hidden');
}

/* ================================================================
   RESET
   ================================================================ */
function confirmReset() {
  document.getElementById('resetModal').classList.remove('hidden');
}
function closeModal() {
  document.getElementById('resetModal').classList.add('hidden');
}
function doReset() {
  localStorage.removeItem(STORAGE_KEY);
  trip = defaultTrip();
  selectedDayIdx = 0;
  closeModal();
  initUI();
}

/* ================================================================
   RENDER: DAY SIDEBAR
   ================================================================ */
function renderDays() {
  const container = document.getElementById('dayList');
  if (!container) return;
  container.innerHTML = '';
  trip.days.forEach((day, i) => {
    const isSelected = i === selectedDayIdx;
    const label = dayLabel(trip, i);
    const actCount = day.activities.length;
    const btn = document.createElement('button');
    btn.className = [
      'w-full text-left px-3 py-2 flex items-center justify-between gap-2 transition-colors',
      isSelected
        ? 'bg-blue-600 text-white'
        : 'hover:bg-slate-100 text-slate-700'
    ].join(' ');
    btn.innerHTML = `
      <span class="font-medium text-sm truncate">Day ${i + 1}<span class="font-normal ml-1 opacity-75 text-xs">${escapeHtml(label)}</span></span>
      <span class="flex-shrink-0 text-xs px-1.5 py-0.5 rounded-full ${isSelected ? 'bg-blue-500 text-blue-100' : 'bg-slate-200 text-slate-500'}">${actCount}</span>
    `;
    btn.onclick = () => { selectedDayIdx = i; renderDays(); renderDetail(); };
    container.appendChild(btn);
  });
  if (trip.days.length === 0) {
    container.innerHTML = '<p class="text-xs text-slate-400 px-3 py-4">No days yet. Add a day to start.</p>';
  }
}

/* ================================================================
   RENDER: SUMMARY
   ================================================================ */
function updateSummary() {
  const totalDays = trip.days.length;
  const totalActs = trip.days.reduce((s, d) => s + d.activities.length, 0);
  const counts = countByType(trip.days);

  // Top bar summary
  const topEl = document.getElementById('topSummary');
  if (topEl) {
    const parts = [];
    parts.push(`<span>${totalDays} day${totalDays !== 1 ? 's' : ''}</span>`);
    parts.push(`<span>${totalActs} activit${totalActs !== 1 ? 'ies' : 'y'}</span>`);
    for (const [type, cnt] of Object.entries(counts)) {
      if (cnt > 0) {
        parts.push(`<span>${TYPES[type]?.emoji || '📌'} ${cnt}</span>`);
      }
    }
    topEl.innerHTML = parts.join('<span class="text-slate-600">·</span>');
  }

  // Sidebar summary
  const sEl = document.getElementById('sidebarSummary');
  if (sEl) {
    const lines = [];
    for (const [type, cnt] of Object.entries(counts)) {
      if (cnt > 0) lines.push(`${TYPES[type]?.emoji} ${TYPES[type]?.label}: ${cnt}`);
    }
    sEl.innerHTML = lines.join('<br>') || '<span class="text-slate-400">No activities yet.</span>';
  }
}

/* ================================================================
   RENDER: DAY DETAIL PANE
   ================================================================ */
function renderDetail() {
  const pane = document.getElementById('dayDetail');
  if (!pane) return;

  if (trip.days.length === 0) {
    pane.innerHTML = `
      <div class="flex flex-col items-center justify-center h-full py-24 text-slate-400">
        <div class="text-5xl mb-4">🗺️</div>
        <p class="text-lg font-semibold text-slate-500">No days yet</p>
        <p class="text-sm mt-1">Click <strong>+ Day</strong> to start building your itinerary.</p>
      </div>`;
    return;
  }

  const dayIdx = selectedDayIdx;
  const day = trip.days[dayIdx];
  if (!day) { selectedDayIdx = 0; renderDetail(); return; }

  const label = dayLabel(trip, dayIdx);
  const sorted = sortActivities(day.activities);

  let html = `
    <div class="max-w-2xl mx-auto px-4 py-6">
      <!-- Day heading -->
      <div class="flex items-center justify-between mb-5">
        <div>
          <h2 class="text-xl font-bold text-slate-800">Day ${dayIdx + 1} <span class="text-slate-400 font-normal text-base ml-1">${escapeHtml(label)}</span></h2>
          <p class="text-xs text-slate-400 mt-0.5">${sorted.length} activit${sorted.length !== 1 ? 'ies' : 'y'}</p>
        </div>
        <button onclick="addActivity(${dayIdx})"
          class="px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold transition-colors flex items-center gap-1">
          + Add activity
        </button>
      </div>

      <!-- Timeline -->
      <div class="timeline-track">`;

  if (sorted.length === 0) {
    html += `
        <div class="ml-12 flex flex-col items-center justify-center py-12 rounded-xl border-2 border-dashed border-slate-200 text-slate-400">
          <span class="text-3xl mb-2">🗓️</span>
          <p class="text-sm font-medium">No activities yet</p>
          <p class="text-xs mt-1">Hit <strong>+ Add activity</strong> to fill this day.</p>
        </div>`;
  } else {
    sorted.forEach((act, actSortIdx) => {
      const typeInfo = TYPES[act.type] || TYPES.other;
      const cssClass = typeCss(act.type);
      const isFirst = actSortIdx === 0;
      const isLast  = actSortIdx === sorted.length - 1;

      html += `
        <!-- Activity -->
        <div class="flex gap-0 mb-4 activity-card" id="card-${escapeHtml(act.id)}">

          <!-- Dot column -->
          <div class="activity-dot">
            <span class="text-lg leading-none" style="margin-top:2px;">${typeInfo.emoji}</span>
          </div>

          <!-- Card -->
          <div class="flex-1 bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden ml-1">

            <!-- Card header: summary row -->
            <div class="px-4 py-3 flex items-start gap-3">
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 flex-wrap">
                  ${act.time ? `<span class="text-xs font-mono text-slate-500 bg-slate-100 px-2 py-0.5 rounded">${escapeHtml(act.time)}</span>` : ''}
                  <span class="cat-pill ${cssClass}">${typeInfo.emoji} ${typeInfo.label}</span>
                </div>
                <p class="font-semibold text-slate-800 mt-1 leading-tight ${!act.title ? 'text-slate-400 italic' : ''}">${act.title ? escapeHtml(act.title) : 'Untitled activity'}</p>
                ${act.location ? `<p class="text-xs text-slate-500 mt-0.5 flex items-center gap-1"><span>📍</span>${escapeHtml(act.location)}</p>` : ''}
                ${act.notes ? `<p class="text-xs text-slate-500 mt-1 line-clamp-2">${escapeHtml(act.notes)}</p>` : ''}
              </div>

              <!-- Action buttons -->
              <div class="flex items-center gap-1 flex-shrink-0 mt-0.5">
                <button onclick="moveActivityUp(${dayIdx}, '${act.id}')" title="Move up"
                  ${isFirst ? 'disabled' : ''}
                  class="p-1 rounded hover:bg-slate-100 text-slate-400 hover:text-slate-600 disabled:opacity-25 disabled:cursor-not-allowed transition-colors text-sm">▲</button>
                <button onclick="moveActivityDown(${dayIdx}, '${act.id}')" title="Move down"
                  ${isLast ? 'disabled' : ''}
                  class="p-1 rounded hover:bg-slate-100 text-slate-400 hover:text-slate-600 disabled:opacity-25 disabled:cursor-not-allowed transition-colors text-sm">▼</button>
                <button onclick="openMoveModal(${dayIdx}, '${act.id}')" title="Move to another day"
                  class="p-1 rounded hover:bg-slate-100 text-slate-400 hover:text-blue-600 transition-colors text-sm" title="Move to another day">↗</button>
                <button onclick="openEditForm(${dayIdx}, '${act.id}')" title="Edit"
                  class="p-1.5 rounded hover:bg-blue-50 text-slate-400 hover:text-blue-700 transition-colors text-sm">✏️</button>
                <button onclick="deleteActivity(${dayIdx}, '${act.id}')" title="Delete"
                  class="p-1.5 rounded hover:bg-red-50 text-slate-400 hover:text-red-600 transition-colors text-sm">🗑️</button>
              </div>
            </div>

            <!-- Inline edit form (hidden by default) -->
            <div id="edit-${act.id}" class="hidden edit-form mx-3 mb-3 px-4 py-3">
              <div class="grid grid-cols-2 gap-3 mb-3">
                <div>
                  <label class="text-xs font-semibold text-slate-500 block mb-1">Time</label>
                  <input id="f-time-${act.id}" type="time" value="${escapeHtml(act.time)}"
                    class="w-full border border-slate-200 rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
                </div>
                <div>
                  <label class="text-xs font-semibold text-slate-500 block mb-1">Type</label>
                  <select id="f-type-${act.id}"
                    class="w-full border border-slate-200 rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
                    ${Object.entries(TYPES).map(([k,v]) =>
                      `<option value="${k}" ${act.type === k ? 'selected' : ''}>${v.emoji} ${v.label}</option>`
                    ).join('')}
                  </select>
                </div>
              </div>
              <div class="mb-3">
                <label class="text-xs font-semibold text-slate-500 block mb-1">Title <span class="text-red-400">*</span></label>
                <input id="f-title-${act.id}" type="text" value="${escapeHtml(act.title)}" placeholder="What are you doing?"
                  class="w-full border border-slate-200 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
              </div>
              <div class="mb-3">
                <label class="text-xs font-semibold text-slate-500 block mb-1">Location</label>
                <input id="f-loc-${act.id}" type="text" value="${escapeHtml(act.location)}" placeholder="Where?"
                  class="w-full border border-slate-200 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
              </div>
              <div class="mb-3">
                <label class="text-xs font-semibold text-slate-500 block mb-1">Notes</label>
                <textarea id="f-notes-${act.id}" rows="2" placeholder="Optional notes…"
                  class="w-full border border-slate-200 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 resize-none">${escapeHtml(act.notes)}</textarea>
              </div>
              <div class="flex gap-2 justify-end">
                <button onclick="closeEditForm('${act.id}')"
                  class="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600 text-sm font-semibold transition-colors">Cancel</button>
                <button onclick="saveActivityFromForm(${dayIdx}, '${act.id}')"
                  class="px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold transition-colors">Save</button>
              </div>
            </div>

          </div>
        </div>`;
    });
  }

  html += `
      </div>
      <!-- Add button at bottom -->
      <div class="mt-4 flex justify-center">
        <button onclick="addActivity(${dayIdx})"
          class="px-4 py-2 rounded-xl border-2 border-dashed border-slate-300 hover:border-blue-400 hover:text-blue-600 text-slate-400 text-sm font-medium transition-colors">
          + Add activity to Day ${dayIdx + 1}
        </button>
      </div>
    </div>`;

  pane.innerHTML = html;
}

/* ================================================================
   INIT
   ================================================================ */
function initUI() {
  // Set header inputs from trip
  const nameEl = document.getElementById('tripName');
  const dateEl = document.getElementById('startDate');
  if (nameEl) nameEl.value = trip.name || '';
  if (dateEl) dateEl.value = trip.startDate || '';

  renderDays();
  renderDetail();
  updateSummary();
}

/* ================================================================
   BOOT
   ================================================================ */
loadTrip();
// DOM ready
document.addEventListener('DOMContentLoaded', initUI);
// If DOMContentLoaded already fired (inline script at end of body)
if (document.readyState !== 'loading') initUI();

/* Close modals on backdrop click */
document.addEventListener('click', function(e) {
  const resetModal = document.getElementById('resetModal');
  const moveModal  = document.getElementById('moveModal');
  if (e.target === resetModal) closeModal();
  if (e.target === moveModal)  closeMoveModal();
});
</script>
</body>
</html>
