<!DOCTYPE html>
<!--
  Color Palette Generator — Halison App Studio example

  Generate harmonious color palettes: lock the colors you like, reroll the rest,
  and click a swatch to copy its hex.

  From the Halison App Studio public library:
  https://github.com/halisonworks/public-app-studio

-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Color Palette Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { height: 100dvh; overflow: hidden; }
    .swatch-transition { transition: transform 0.15s ease, box-shadow 0.15s ease; }
    .swatch-transition:hover { transform: scaleY(1.03); box-shadow: 0 8px 30px rgba(0,0,0,0.25); }
    .lock-btn { transition: opacity 0.2s ease, background 0.2s ease; }
    .copied-toast {
      animation: fadeInOut 1.2s ease forwards;
    }
    @keyframes fadeInOut {
      0%   { opacity: 0; transform: translateY(4px); }
      15%  { opacity: 1; transform: translateY(0); }
      75%  { opacity: 1; }
      100% { opacity: 0; transform: translateY(-4px); }
    }
  </style>
</head>
<body class="bg-gray-950 flex flex-col select-none">

  <!-- Header -->
  <header class="flex items-center justify-between px-6 py-4 shrink-0">
    <div>
      <h1 class="text-white text-xl font-bold tracking-tight">Color Palette</h1>
      <p class="text-gray-400 text-sm mt-0.5">Lock swatches you love, reroll the rest</p>
    </div>
    <button
      id="generateBtn"
      class="bg-white text-gray-900 font-semibold text-sm px-5 py-2.5 rounded-full hover:bg-gray-100 active:scale-95 transition-all duration-150 shadow"
    >
      Generate
    </button>
  </header>

  <!-- Palette -->
  <main id="palette" class="flex flex-1 gap-2 px-4 pb-4 min-h-0">
    <!-- swatches injected by JS -->
  </main>

  <script>
    // ─── Color Math ───────────────────────────────────────────────────────────

    function hslToHex(h, s, l) {
      s /= 100; l /= 100;
      const a = s * Math.min(l, 1 - l);
      const f = n => {
        const k = (n + h / 30) % 12;
        const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
        return Math.round(255 * color).toString(16).padStart(2, '0');
      };
      return '#' + f(0) + f(8) + f(4);
    }

    function hexToHsl(hex) {
      let r = parseInt(hex.slice(1,3),16)/255;
      let g = parseInt(hex.slice(3,5),16)/255;
      let b = parseInt(hex.slice(5,7),16)/255;
      const max = Math.max(r,g,b), min = Math.min(r,g,b);
      let h, s, l = (max+min)/2;
      if (max === min) { h = s = 0; }
      else {
        const d = max - min;
        s = l > 0.5 ? d/(2-max-min) : d/(max+min);
        switch(max){
          case r: h = ((g-b)/d + (g<b?6:0))/6; break;
          case g: h = ((b-r)/d + 2)/6; break;
          case b: h = ((r-g)/d + 4)/6; break;
        }
      }
      return [Math.round(h*360), Math.round(s*100), Math.round(l*100)];
    }

    // Harmony schemes: each returns array of 5 [h,s,l] triples
    const SCHEMES = [
      // Analogous
      (h, s, l) => [
        [h,               s,        l],
        [(h + 30)  % 360, s,        clampL(l - 8)],
        [(h + 60)  % 360, s - 5,    clampL(l + 8)],
        [(h - 30 + 360) % 360, s,   clampL(l - 5)],
        [(h - 60 + 360) % 360, s - 5, clampL(l + 5)],
      ],
      // Complementary split
      (h, s, l) => [
        [h,                    s,        l],
        [(h + 180) % 360,      s,        l],
        [(h + 150) % 360,      s - 8,    clampL(l + 10)],
        [(h + 210) % 360,      s - 8,    clampL(l + 10)],
        [(h + 30)  % 360,      s - 5,    clampL(l - 10)],
      ],
      // Triadic
      (h, s, l) => [
        [h,                s,      l],
        [(h + 120) % 360,  s,      clampL(l - 5)],
        [(h + 240) % 360,  s,      clampL(l + 8)],
        [(h + 60)  % 360,  s - 10, clampL(l + 12)],
        [(h + 180) % 360,  s - 10, clampL(l - 12)],
      ],
      // Square (tetradic)
      (h, s, l) => [
        [h,                s,      l],
        [(h + 90)  % 360,  s,      clampL(l + 5)],
        [(h + 180) % 360,  s - 5,  clampL(l - 5)],
        [(h + 270) % 360,  s,      clampL(l + 10)],
        [(h + 45)  % 360,  s - 10, clampL(l - 8)],
      ],
      // Monochromatic
      (h, s, l) => [
        [h, s,      20],
        [h, s,      38],
        [h, s - 5,  55],
        [h, s - 10, 70],
        [h, s - 15, 85],
      ],
    ];

    function clampL(l) { return Math.min(88, Math.max(18, l)); }

    function randomPalette() {
      const h = Math.floor(Math.random() * 360);
      const s = 55 + Math.floor(Math.random() * 30);   // 55–84
      const l = 38 + Math.floor(Math.random() * 18);   // 38–55
      const scheme = SCHEMES[Math.floor(Math.random() * SCHEMES.length)];
      return scheme(h, s, l).map(([hh, ss, ll]) =>
        hslToHex(
          (hh + 360) % 360,
          Math.min(100, Math.max(10, ss)),
          Math.min(90, Math.max(12, ll))
        )
      );
    }

    // ─── State ────────────────────────────────────────────────────────────────

    let colors  = ['#000000','#000000','#000000','#000000','#000000'];
    let locked  = [false, false, false, false, false];

    // ─── DOM helpers ─────────────────────────────────────────────────────────

    function contrastColor(hex) {
      const [,, l] = hexToHsl(hex);
      return l > 52 ? '#1a1a1a' : '#ffffff';
    }

    function buildSwatch(index) {
      const hex   = colors[index];
      const fg    = contrastColor(hex);
      const isLocked = locked[index];

      const col = document.createElement('div');
      col.className = 'relative flex-1 rounded-2xl swatch-transition cursor-pointer flex flex-col justify-between overflow-hidden';
      col.style.backgroundColor = hex;
      col.dataset.index = index;

      // Lock button
      const lockWrap = document.createElement('div');
      lockWrap.className = 'flex justify-end p-3';

      const lockBtn = document.createElement('button');
      lockBtn.className = 'lock-btn w-9 h-9 rounded-full flex items-center justify-center text-lg focus:outline-none';
      lockBtn.style.background = isLocked
        ? (contrastColor(hex) === '#ffffff' ? 'rgba(255,255,255,0.25)' : 'rgba(0,0,0,0.15)')
        : 'transparent';
      lockBtn.title = isLocked ? 'Unlock' : 'Lock';
      lockBtn.setAttribute('aria-label', isLocked ? 'Unlock color' : 'Lock color');
      lockBtn.innerHTML = isLocked
        ? `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18" style="color:${fg}"><path fill-rule="evenodd" d="M12 1.5a5.25 5.25 0 00-5.25 5.25v3a3 3 0 00-3 3v6.75a3 3 0 003 3h10.5a3 3 0 003-3v-6.75a3 3 0 00-3-3v-3A5.25 5.25 0 0012 1.5zm3.75 8.25v-3a3.75 3.75 0 10-7.5 0v3h7.5z" clip-rule="evenodd"/></svg>`
        : `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18" style="color:${fg};opacity:0.5"><path d="M18 1.5c2.9 0 5.25 2.35 5.25 5.25v3.75a.75.75 0 01-1.5 0V6.75a3.75 3.75 0 00-7.5 0v3h.75a3 3 0 013 3v6.75a3 3 0 01-3 3H3.75a3 3 0 01-3-3v-6.75a3 3 0 013-3H15v-3C15 3.85 16.65 1.5 18 1.5z"/></svg>`;

      lockBtn.addEventListener('click', e => {
        e.stopPropagation();
        locked[index] = !locked[index];
        renderPalette();
      });

      lockWrap.appendChild(lockBtn);

      // Hex label + copy feedback
      const bottom = document.createElement('div');
      bottom.className = 'p-4 flex flex-col items-center gap-1';

      const toast = document.createElement('span');
      toast.className = 'text-xs font-semibold tracking-widest pointer-events-none';
      toast.style.color = fg;
      toast.style.opacity = '0';
      toast.style.height = '16px';
      toast.textContent = 'COPIED!';
      toast.id = `toast-${index}`;

      const hexLabel = document.createElement('span');
      hexLabel.className = 'font-mono font-bold text-sm tracking-widest uppercase';
      hexLabel.style.color = fg;
      hexLabel.textContent = hex.toUpperCase();

      bottom.appendChild(toast);
      bottom.appendChild(hexLabel);

      col.appendChild(lockWrap);
      col.appendChild(bottom);

      // Copy on swatch click
      col.addEventListener('click', () => copyHex(index, hex));

      return col;
    }

    function renderPalette() {
      const palette = document.getElementById('palette');
      palette.innerHTML = '';
      for (let i = 0; i < 5; i++) {
        palette.appendChild(buildSwatch(i));
      }
    }

    function generate() {
      const next = randomPalette();
      colors = colors.map((c, i) => locked[i] ? c : next[i]);
      renderPalette();
    }

    async function copyHex(index, hex) {
      try {
        await navigator.clipboard.writeText(hex.toUpperCase());
      } catch {
        // fallback for non-secure contexts
        const ta = document.createElement('textarea');
        ta.value = hex.toUpperCase();
        ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select(); document.execCommand('copy');
        document.body.removeChild(ta);
      }
      showToast(index);
    }

    function showToast(index) {
      const toast = document.getElementById(`toast-${index}`);
      if (!toast) return;
      toast.style.opacity = '';
      toast.classList.remove('copied-toast');
      // Force reflow
      void toast.offsetWidth;
      toast.classList.add('copied-toast');
      toast.addEventListener('animationend', () => {
        toast.style.opacity = '0';
        toast.classList.remove('copied-toast');
      }, { once: true });
    }

    // ─── Init ─────────────────────────────────────────────────────────────────

    document.getElementById('generateBtn').addEventListener('click', generate);

    // Generate on load
    generate();
  </script>
</body>
</html>
